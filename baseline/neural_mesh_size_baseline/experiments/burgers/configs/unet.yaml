experiment: b3000_continuous_mesh_size_mse
seed: 42
deterministic: false
data:
  path: data/burgers/burgers_mesh_size_3100.h5
model:
  in_channels: 4
  channels: [3, 6, 12, 24, 27]
  parameter_matching_target: 48190
training:
  epochs: 1000
  batch_size: 16
  inference_batch_size: 16
  num_workers: 4
  learning_rate: 1.0e-3
  eta_min: 1.0e-5
  weight_decay: 1.0e-6
  grad_clip: 1.0
  device: cuda:0
  bf16_amp: false
  log_every: 10
  save_every: 10
evaluation:
  coordinate_mode: normalized_xt
  size_scale: 1.0
  minimum_size: 4.8828125e-4
  maximum_size: 3.125e-2
  gmsh_algorithm: 6
  newton_max_iterations: 40
  newton_tolerance: 1.0e-6
  newton_relative_tolerance: 1.0e-6
  maximum_elements: 3000000
