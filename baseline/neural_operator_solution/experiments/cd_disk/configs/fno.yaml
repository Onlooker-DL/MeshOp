problem: cd_disk
experiment: b3000_spectral_solution_mse
seed: 42
data:
  path: data/cd_disk/cd_disk_spectral_3100.h5
  train_samples: 3000
  test_samples: 100
model:
  name: fno
  in_channels: 5
  width: 12
  modes_x: 8
  modes_t: 6
  layers: 4
  projection_width: 64
  padding_t: 4
  dropout: 0.03
training:
  epochs: 1000
  batch_size: 16
  inference_sample_batch_size: 16
  num_workers: 4
  learning_rate: 1.0e-3
  eta_min: 1.0e-5
  weight_decay: 1.0e-6
  grad_clip: 1.0
  device: cuda:0
  log_every: 10
  save_every: 50
