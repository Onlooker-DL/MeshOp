problem: reaction_diffusion
experiment: b3000_exact_solution_mse
seed: 42
data:
  path: data/reaction_diffusion/reaction_diffusion_exact_3100.h5
  train_samples: 3000
  test_samples: 100
model:
  name: deeponet
  latent_dim: 88
  hidden_dim: 54
  branch_depth: 4
  trunk_depth: 4
  activation: gelu
  dropout: 0.0
training:
  epochs: 2000
  batch_size: 8
  train_query_points: 8192
  query_batch_size: 16384
  inference_sample_batch_size: 2
  num_workers: 4
  learning_rate: 1.0e-3
  eta_min: 1.0e-5
  weight_decay: 1.0e-6
  grad_clip: 1.0
  device: cuda:0
  log_every: 10
  save_every: 50
