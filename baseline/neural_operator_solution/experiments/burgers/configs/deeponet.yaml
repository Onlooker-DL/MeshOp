experiment: b3000_spectral_solution_mse
seed: 42
deterministic: false
data:
  path: data/burgers/burgers_spectral_3100.h5
model:
  name: deeponet
  latent_dim: 64
  hidden_dim: 56
  branch_depth: 4
  trunk_depth: 4
  activation: gelu
  dropout: 0.0
training:
  epochs: 10000
  batch_size: 16
  num_workers: 4
  train_query_points: 4096
  query_batch_size: 10201
  inference_sample_batch_size: 8
  learning_rate: 1.0e-3
  eta_min: 1.0e-5
  weight_decay: 1.0e-6
  grad_clip: 1.0
  device: cuda:0
  log_every: 10
  save_every: 50
