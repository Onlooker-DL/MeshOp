experiment: b3000_spectral_solution_mse
seed: 42
deterministic: false
data:
  path: data/burgers/burgers_spectral_3100.h5
model:
  name: cno
  in_channels: 4
  out_channels: 1
  width: 10
  levels: 2
  n_res_bottleneck: 2
  n_res_intermediate: 2
  kernel_size: 3
  activation: gelu
  dropout: 0.0
training:
  epochs: 1000
  batch_size: 16
  inference_sample_batch_size: 2
  num_workers: 4
  learning_rate: 1.0e-3
  eta_min: 1.0e-5
  weight_decay: 1.0e-6
  grad_clip: 1.0
  device: cuda:0
  bf16_amp: false
  log_every: 10
  save_every: 50
