experiment: b3000_spectral_solution_mse
seed: 42
deterministic: false
data:
  path: data/burgers/burgers_spectral_3100.h5
model:
  name: fno
  nx_input: 256
  in_channels: 4
  width: 9
  modes_x: 6
  modes_t: 6
  layers: 4
  projection_width: 96
  padding_t: 9
  dropout: 0.03
training:
  epochs: 1000
  batch_size: 16
  inference_sample_batch_size: 8
  num_workers: 4
  learning_rate: 1.0e-3
  eta_min: 1.0e-5
  weight_decay: 1.0e-6
  grad_clip: 1.0
  device: cuda:0
  bf16_amp: false
  log_every: 10
  save_every: 10
