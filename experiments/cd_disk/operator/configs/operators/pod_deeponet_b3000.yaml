problem: cd_disk
experiment: cd_b3000_mse
seed: 42
deterministic: false
data:
  path: data/cd_disk/cd_disk_3100.mat
  total_samples: 3100
  train_samples: 3000
  test_samples: 100
  split_mode: prefix_train_tail_test
model:
  name: pod_deeponet
  branch_dim: 258
  hidden_dim: 144
  depth: 4
  activation: gelu
  dropout: 0.0
pod:
  energy: 0.99
  maximum_rank: 196
  oversampling: 16
  sample_chunk: 32
training:
  loss: mse
  epochs: 10000
  batch_size: 8
  num_workers: 4
  learning_rate: 1.0e-3
  eta_min: 1.0e-5
  weight_decay: 1.0e-6
  grad_clip: 1.0
  device: cuda:0
  log_every: 10
score:
  maximum: 12
  generation_threshold: 0.50