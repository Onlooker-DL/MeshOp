problem: cd_disk
experiment: cd_b2000_mse
seed: 42
deterministic: false
data:
  path: data/cd_disk/cd_disk_3100.mat
  total_samples: 3100
  train_samples: 2000
  test_samples: 100
  split_mode: prefix_train_tail_test
model:
  name: fno
  # Polar grid 64(r) x 128(theta); the runner feeds the model the
  # transposed (theta, r) array so the periodic axis (theta) is dim 1.
  in_channels: 5
  width: 12
  modes_x: 8
  modes_t: 6
  layers: 4
  projection_width: 64
  padding_t: 4
  dropout: 0.03
training:
  loss: mse
  epochs: 1000
  batch_size: 16
  num_workers: 4
  learning_rate: 1.0e-3
  eta_min: 1.0e-5
  weight_decay: 1.0e-6
  grad_clip: 1.0
  device: cuda:0
  log_every: 10
score:
  maximum: 12
  generation_threshold: 0.50