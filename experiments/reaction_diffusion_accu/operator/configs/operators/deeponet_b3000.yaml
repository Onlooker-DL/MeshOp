problem: reaction_diffusion
experiment: rd_accu_b3000_mse
seed: 42
deterministic: false
data:
  path: data/reaction_diffusion_accu/reaction_diffusion_accu_3100.mat
  total_samples: 3100
  split_mode: prefix_train_tail_test
  test_samples: 100
  train_samples: 3000
model:
  name: deeponet
  latent_dim: 88
  hidden_dim: 54
  branch_depth: 4
  trunk_depth: 4
  activation: gelu
  dropout: 0.0
training:
  loss: mse
  epochs: 2000
  batch_size: 8
  num_workers: 4
  train_query_points: 8192
  query_batch_size: 16384
  inference_sample_batch_size: 2
  learning_rate: 0.001
  eta_min: 1.0e-05
  weight_decay: 1.0e-06
  grad_clip: 1.0
  log_every: 10
  device: cuda:0
score:
  maximum: 12
  generation_threshold: 0.5
