problem: reaction_diffusion
experiment: rd_accu_b3000_mse
seed: 42
deterministic: false
data:
  path: data/reaction_diffusion_accu/reaction_diffusion_accu_3100.mat
  total_samples: 3100
  split_mode: prefix_train_tail_test
  test_samples: 100
  train_samples: 3000
model:
  name: pod_deeponet
  hidden_dim: 56
  depth: 4
  activation: gelu
  dropout: 0.0
pod:
  energy: 0.99
  maximum_rank: 128
  oversampling: 16
  sample_chunk: 4
training:
  loss: mse
  epochs: 5000
  batch_size: 16
  num_workers: 4
  learning_rate: 0.001
  eta_min: 1.0e-05
  weight_decay: 1.0e-06
  grad_clip: 1.0
  log_every: 10
  device: cuda:0
score:
  maximum: 12
  generation_threshold: 0.5
