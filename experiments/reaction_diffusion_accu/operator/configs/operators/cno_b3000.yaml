problem: reaction_diffusion
experiment: rd_accu_b3000_mse
seed: 42
deterministic: false
data:
  path: data/reaction_diffusion_accu/reaction_diffusion_accu_3100.mat
  total_samples: 3100
  train_samples: 3000
  test_samples: 100
  split_mode: prefix_train_tail_test
model:
  name: cno
  dim: 3
  in_channels: 4
  out_channels: 1
  # Aligned with the FNO rd_accu_b2000_mse configuration (~486k scalar
  # parameters). This CNO is approximately 455k; the training script prints
  # the exact count, adjust n_res_bottleneck / n_res_intermediate to tune.
  width: 10
  levels: 3
  n_res_bottleneck: 1
  n_res_intermediate: 1
  kernel_size: 3
  activation: gelu
  dropout: 0.0
training:
  loss: mse
  epochs: 1000
  batch_size: 4
  num_workers: 4
  learning_rate: 1.0e-3
  eta_min: 1.0e-5
  weight_decay: 1.0e-6
  grad_clip: 1.0
  device: cuda:0
  bf16_amp: true
  log_every: 10
  inference_sample_batch_size: 1
score:
  maximum: 10
  generation_threshold: 0.50
