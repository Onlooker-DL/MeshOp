problem: reaction_diffusion
experiment: rd_accu_b1000_mse
seed: 42
deterministic: false
data:
  path: data/reaction_diffusion_accu/reaction_diffusion_accu_3100.mat
  total_samples: 3100
  split_mode: prefix_train_tail_test
  test_samples: 100
  train_samples: 1000
model:
  name: fno
  width: 11
  modes_x: 5
  modes_y: 5
  modes_z: 5
  layers: 4
  projection_width: 64
  padding: 4
  dropout: 0.03
training:
  loss: mse
  epochs: 1000
  batch_size: 2
  num_workers: 4
  learning_rate: 0.001
  eta_min: 1.0e-05
  weight_decay: 1.0e-06
  grad_clip: 1.0
  device: cuda:0
  bf16_amp: true
  save_every: 10
  test_every: 20
score:
  maximum: 12
  generation_threshold: 0.5
